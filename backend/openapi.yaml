openapi: 3.0.3

info:
  title: Импорт товаров
  version: 1.0.0
  description: |
    API каталога товаров, загружаемых из xlsx.
    Ошибки возвращаются в едином формате `{"error": {"code", "message"}}`, сообщения на русском.

    Все эндпоинты, кроме входа и проверки состояния, требуют заголовок `Authorization: Bearer <token>`.
    Токен выдаёт `POST /api/auth/login`.

servers:
  - url: /

security:
  - bearerAuth: []

tags:
  - name: Авторизация
  - name: Товары
  - name: Импорт
  - name: Служебное

paths:
  /api/health:
    get:
      tags: [Служебное]
      summary: Состояние приложения
      description: Проверяет доступность PostgreSQL и RabbitMQ.
      operationId: health
      security: []
      responses:
        '200':
          description: Все зависимости доступны
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Одна из зависимостей недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /api/auth/login:
    post:
      tags: [Авторизация]
      summary: Вход
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: Токен доступа
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AccessToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/auth/me:
    get:
      tags: [Авторизация]
      summary: Текущий пользователь
      operationId: me
      responses:
        '200':
          description: Пользователь, которому выдан токен
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/products:
    get:
      tags: [Товары]
      summary: Список товаров
      description: Постраничный список с поиском по названию и фильтром по цене. Сортировка по названию.
      operationId: listProducts
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100000
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: name
          in: query
          description: Подстрока названия без учёта регистра
          schema:
            type: string
            maxLength: 255
          example: легинсы
        - name: priceFrom
          in: query
          description: Минимальная цена включительно, допускается запятая
          schema:
            type: string
            pattern: '^\d{1,10}([.,]\d{1,2})?$'
          example: '800'
        - name: priceTo
          in: query
          description: Максимальная цена включительно, допускается запятая
          schema:
            type: string
            pattern: '^\d{1,10}([.,]\d{1,2})?$'
          example: '1000'
      responses:
        '200':
          description: Страница товаров
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductListItem'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/products/{id}:
    get:
      tags: [Товары]
      summary: Карточка товара
      operationId: getProduct
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Товар с атрибутами и изображениями
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/imports:
    post:
      tags: [Импорт]
      summary: Загрузить xlsx-файл
      description: |
        Файл проверяется (расширение, MIME, размер, структура xlsx) и ставится в очередь.
        Обработку выполняет воркер, ход импорта смотрите в `GET /api/imports/{id}`.
        Не больше 5 загрузок в минуту на пользователя.
      operationId: uploadImport
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '202':
          description: Файл принят, задача поставлена в очередь
          headers:
            Location:
              schema:
                type: string
              example: /api/imports/0192f6c4-7a1b-7c3d-8e9f-0a1b2c3d4e5f
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ImportJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: Файл больше допустимого размера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Файл не xlsx или повреждён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          description: Превышен лимит загрузок
          headers:
            Retry-After:
              description: Через сколько секунд можно повторить
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Очередь импорта недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/imports/{id}:
    get:
      tags: [Импорт]
      summary: Статус и прогресс импорта
      operationId: getImport
      parameters:
        - $ref: '#/components/parameters/ImportId'
      responses:
        '200':
          description: Задача импорта
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ImportJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/imports/{id}/errors:
    get:
      tags: [Импорт]
      summary: Отчёт об ошибках и предупреждениях
      description: Записи отсортированы по номеру строки в файле. Номер строки совпадает с номером в Excel.
      operationId: listImportErrors
      parameters:
        - $ref: '#/components/parameters/ImportId'
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Страница отчёта
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ImportError'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

components:
  parameters:
    ImportId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Нет токена, токен просрочен или неверные учётные данные
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationFailed:
      description: Некорректные параметры запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Decimal:
      type: string
      pattern: '^\d+\.\d{2}$'
      example: '1320.00'

    Health:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, fail]
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [ok, fail]
          example:
            database: ok
            rabbitmq: ok

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: validation_failed
            message:
              type: string
              example: Проверьте параметры запроса
            fields:
              type: object
              description: Ошибки по полям, только для кода validation_failed
              additionalProperties:
                type: string
              example:
                limit: Размер страницы должен быть целым числом от 1 до 100

    ImportJob:
      type: object
      required: [id, status, fileName, totalRows, processedRows, createdCount, updatedCount, failedCount, warningCount, error, createdAt, startedAt, finishedAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, processing, completed, failed]
          description: completed ставится и тогда, когда часть строк не прошла проверку — они есть в отчёте
        fileName:
          type: string
          example: import example.xlsx
        totalRows:
          type: integer
          example: 40
        processedRows:
          type: integer
          example: 18
        createdCount:
          type: integer
        updatedCount:
          type: integer
        failedCount:
          type: integer
        warningCount:
          type: integer
        error:
          type: string
          nullable: true
          description: Причина, если весь файл не удалось обработать
          example: 'В файле нет обязательных колонок: Внешний код'
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true

    ImportError:
      type: object
      required: [row, externalCode, level, message]
      properties:
        row:
          type: integer
          example: 7
        externalCode:
          type: string
          nullable: true
          example: 3UHfAid1jaMiwgBuNvnsf3
        level:
          type: string
          enum: [error, warning]
        message:
          type: string
          example: Цена продажи «договорная» не является числом

    Credentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          example: admin@example.com
        password:
          type: string
          example: admin123

    AccessToken:
      type: object
      required: [token, expiresAt]
      properties:
        token:
          type: string
          example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9…
        expiresAt:
          type: string
          format: date-time

    User:
      type: object
      required: [id, email]
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          example: admin@example.com

    PageMeta:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 40
        totalPages:
          type: integer
          example: 2

    ProductListItem:
      type: object
      required: [id, externalCode, name, price, discount]
      properties:
        id:
          type: integer
          example: 12
        externalCode:
          type: string
          example: 3UHfAid1jaMiwgBuNvnsf3
        name:
          type: string
          example: Бермуды мужские, Grigio/Verde, OMSA, 46(M), РОССИЯ
        price:
          $ref: '#/components/schemas/Decimal'
        discount:
          description: Скидка в процентах, (цена продажи − закупочная) / цена продажи × 100
          allOf:
            - $ref: '#/components/schemas/Decimal'
          nullable: true
          example: '33.33'

    Product:
      allOf:
        - $ref: '#/components/schemas/ProductListItem'
        - type: object
          required: [description, attributes, images, createdAt, updatedAt]
          properties:
            description:
              type: string
              nullable: true
            attributes:
              type: array
              items:
                $ref: '#/components/schemas/ProductAttribute'
            images:
              type: array
              items:
                $ref: '#/components/schemas/ProductImage'
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    ProductAttribute:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
          example: Цвет
        value:
          type: string
          example: Grigio/Verde

    ProductImage:
      type: object
      required: [id, url, path, src]
      properties:
        id:
          type: integer
          example: 5
        url:
          type: string
          description: Исходная ссылка из файла импорта
          example: http://catalog.collant.ru/pics/SNL-504038_m.jpg
        path:
          type: string
          description: Путь к скачанному файлу относительно хранилища
          example: images/3f/3fa2b1c4d5e6f708192a3b4c5d6e7f8091a2b3c4.jpg
        src:
          type: string
          description: Адрес, по которому файл отдаёт веб-сервер
          example: /media/images/3f/3fa2b1c4d5e6f708192a3b4c5d6e7f8091a2b3c4.jpg
