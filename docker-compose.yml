services:
  app:
    build:
      context: ./backend
      target: prod
    env_file: .env
    volumes:
      - storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      target: prod
    command: ["bin/console", "app:import:worker", "--time-limit=3600", "--memory-limit=256"]
    user: www-data
    env_file: .env
    volumes:
      - storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build:
      context: ./frontend
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - storage:/app/storage:ro
    depends_on:
      - app
      - swagger
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  swagger:
    image: swaggerapi/swagger-ui:v5.17.14
    environment:
      BASE_URL: /docs
      SWAGGER_JSON: /spec/openapi.yaml
    volumes:
      - ./backend/openapi.yaml:/spec/openapi.yaml:ro
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  php:
    build:
      context: ./backend
      target: dev
    profiles:
      - tools
    env_file: .env
    environment:
      APP_DEBUG: "1"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  node:
    image: node:24-alpine
    profiles:
      - tools
    working_dir: /app
    environment:
      HOME: /tmp
      npm_config_cache: /tmp/npm
      NG_CLI_ANALYTICS: "false"
      npm_config_update_notifier: "false"
      API_URL: http://nginx
    volumes:
      - ./frontend:/app
    ports:
      - "${FRONTEND_PORT:-4200}:4200"

volumes:
  pgdata:
  storage:
